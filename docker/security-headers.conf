# Included in every location block of nginx.conf.
#
# This CSP complements the one in the page's <meta> tag (SvelteKit kit.csp).
# Browsers enforce both, so it must NOT contain default-src or script-src,
# or it would block SvelteKit's hashed inline scripts. It only adds what a
# meta tag cannot express (frame-ancestors) plus non-conflicting directives.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS is set by the TLS-terminating reverse proxy, not here.
