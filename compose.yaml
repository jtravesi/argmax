services:
  argmax:
    build:
      context: .
      args:
        BASE_PATH: ''
    image: ghcr.io/jtravesi/argmax:latest
    container_name: argmax
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
