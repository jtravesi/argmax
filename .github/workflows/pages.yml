# Deploys the static build to Cloudflare Pages (ARCHITECTURE.md §8), only after CI
# passes on main. Until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
# are set, it does nothing. The project name can be changed with the repository
# variable CLOUDFLARE_PROJECT (default: argmax).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check that deployment is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not set; skipping the deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.configured.outputs.ok == 'true'
        run: npm ci
      - if: steps.configured.outputs.ok == 'true'
        run: npm run build
        env:
          BASE_PATH: ''
      - if: steps.configured.outputs.ok == 'true'
        name: Same security headers as the Docker image
        run: node scripts/cf-headers.ts > build/_headers
      - if: steps.configured.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CLOUDFLARE_PROJECT || 'argmax' }} --branch=main
